<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bass Fretboard Trainer · V0</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="shell">
    <header>
      <p class="eyebrow">BASS FRETBOARD TRAINER</p>
      <h1>V0 音高检测</h1>
      <p class="subtitle">验证贝斯 → 声卡 → 浏览器的实时识别链路</p>
    </header>

    <section class="card controls" aria-label="音频输入设置">
      <label for="deviceSelect">音频输入设备</label>
      <div class="control-row">
        <select id="deviceSelect" disabled>
          <option value="">点击“开始检测”后读取设备</option>
        </select>
        <button id="startButton">开始检测</button>
      </div>
      <p id="deviceStatus" class="status" role="status"><span class="dot"></span> 尚未连接</p>
    </section>

    <section class="card result" aria-live="polite">
      <p id="hint" class="hint">连接后，弹响一根弦</p>
      <div id="note" class="note">—</div>
      <div class="frequency"><span id="frequency">—</span><span class="unit"> Hz</span></div>
      <div class="tuning">
        <span id="flatLabel">♭</span>
        <div class="meter"><div id="meterFill" class="meter-fill"></div><i class="center-mark"></i></div>
        <span id="sharpLabel">♯</span>
      </div>
      <p id="cents" class="cents">等待信号</p>
    </section>

    <section class="diagnostics" aria-label="检测状态">
      <div><span>信号</span><strong id="level">— dB</strong></div>
      <div><span>置信度</span><strong id="confidence">—</strong></div>
      <div><span>分析窗口</span><strong id="latency">— ms</strong></div>
    </section>

    <details class="tips">
      <summary>没有反应或识别跳动？</summary>
      <ul>
        <li>在上方确认已选择 Synido LIVE DOCK A20。</li>
        <li>用指腹弹单音，弹完后让它自然延音；不要同时碰响其他弦。</li>
        <li>把声卡输入增益调到信号约 −35 至 −10 dB，避免削波。</li>
        <li>关闭浏览器或系统的“语音隔离”、自动增益和降噪。</li>
      </ul>
    </details>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
